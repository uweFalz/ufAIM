<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1240 1754" role="img" aria-labelledby="t d">
  <title id="t">Evidence Aperture 2A — Unbroken Subject</title>
  <desc id="d">An uninterrupted railway alignment crosses the page. A witnessed observation branches through an open aperture into a bounded comparison sheet. A human authority seal remains detached.</desc>
  <rect width="1240" height="1754" fill="#F3F4F2"/>
  <g fill="#191D21">
    <text x="105" y="165" font-family="Latin Modern Roman, Georgia, serif" font-size="66" font-weight="700">AIM Foundations</text>
    <text x="110" y="222" font-family="Latin Modern Sans, Arial, sans-serif" font-size="23" letter-spacing="3">EVIDENCE APERTURE · 2A</text>
  </g>

  <!-- Unchanged subject -->
  <path d="M-80 1280 C190 1110 345 1205 525 1110 C700 1018 805 1150 975 1055 C1110 980 1190 930 1320 900"
        fill="none" stroke="#167C80" stroke-width="34" stroke-linecap="round"/>
  <g stroke="#F3F4F2" stroke-width="8">
    <path d="M202 1138l18 45"/><path d="M420 1134l8 48"/><path d="M695 1054l-9 49"/>
    <path d="M932 1040l20 43"/><path d="M1133 947l18 45"/>
  </g>

  <!-- Witness and provenance -->
  <circle cx="405" cy="1140" r="29" fill="#F3F4F2" stroke="#C58A22" stroke-width="11"/>
  <circle cx="354" cy="1196" r="8" fill="#C58A22"/>
  <circle cx="327" cy="1224" r="6" fill="#C58A22"/>
  <circle cx="305" cy="1248" r="4" fill="#C58A22"/>
  <path d="M425 1118 C505 1000 540 900 598 795" fill="none" stroke="#C58A22" stroke-width="15" stroke-linecap="round"/>

  <!-- Aperture -->
  <g transform="translate(630 730) rotate(45)">
    <rect x="-104" y="-104" width="208" height="208" fill="#F3F4F2" stroke="#191D21" stroke-width="16"/>
    <rect x="-47" y="-47" width="94" height="94" fill="none" stroke="#C58A22" stroke-width="10"/>
  </g>

  <!-- Emerging representation / evaluation sheet -->
  <path d="M703 642 L1038 438 L1110 690 L780 850 Z" fill="#F3F4F2" stroke="#191D21" stroke-width="8"/>
  <path d="M748 681 C835 614 900 654 1028 552" fill="none" stroke="#191D21" stroke-width="12"/>
  <path d="M766 727 C845 669 922 710 1050 610" fill="none" stroke="#191D21" stroke-width="4" stroke-dasharray="15 12" opacity=".55"/>
  <path d="M944 518v94M928 518h32M928 612h32" stroke="#C58A22" stroke-width="7"/>

  <!-- Detached accountable authority -->
  <path d="M1028 378h130" stroke="#D94A32" stroke-width="7" stroke-dasharray="14 15"/>
  <g transform="translate(1095 285)">
    <circle r="67" fill="#F3F4F2" stroke="#D94A32" stroke-width="12"/>
    <circle r="45" fill="none" stroke="#191D21" stroke-width="5"/>
    <circle cy="-12" r="12" fill="#191D21"/>
    <path d="M-24 23 Q0 4 24 23" fill="none" stroke="#191D21" stroke-width="8" stroke-linecap="round"/>
    <path d="M18 6l10 10 20-25" fill="none" stroke="#D94A32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(110 1558)" fill="#191D21">
    <rect width="1020" height="2"/>
    <text y="55" font-family="Latin Modern Roman, Georgia, serif" font-size="25">Uwe Falz</text>
    <text x="1020" y="55" text-anchor="end" font-family="Latin Modern Sans, Arial, sans-serif" font-size="20" letter-spacing="2">RESEARCH PROTOTYPE</text>
